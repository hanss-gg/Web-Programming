<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Store - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-body">

    <header class="navbar-header">
        <nav class="navbar">
            <div class="logo">
                <a href="#home">PC PARTS STORE</a>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-container">

        <section id="home" class="hero-section">
            <div class="hero-overlay">
                <h1 class="hero-text">
                    Upgrade PC, Maksimalkan <span class="highlight-word">Performa</span>.
                </h1>
            </div>
        </section>

        <section id="products" class="products-section">
            <h2 class="section-title">Products</h2>
            <div class="products-grid">
                
                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/ssd.jpg" alt="Solid State Drive (SSD)">
                    </div>
                    <p class="product-name">SSD</p>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/ram.jpg" alt="Random Access Memory (RAM)">
                    </div>
                    <p class="product-name">RAM</p>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/cpu.jpg" alt="Prosesor (CPU)">
                    </div>
                    <p class="product-name">Prosesor</p>
                </div>

                <div class="product-card">
                    <div class="image-wrapper">
                        <img src="images/gpu.jpg" alt="Kartu Grafis (GPU)">
                    </div>
                    <p class="product-name">Kartu Grafis</p>
                </div>

            </div>
        </section>

        <section id="about" class="about-section">
            <h2 class="section-title">About</h2>
            <p class="about-description">Pilihan komponen untuk kebutuhan upgrade PC kamu.</p>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 PC Parts Store. All rights reserved.</p>
    </footer>

</body>
</html>
