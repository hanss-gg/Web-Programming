<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Data Mahasiswa</h2>
    <form>
        <table>
            <tr>
                <td>NIM :</td>
                <td><input type="text" name="nim" required></td>
            </tr>
            <tr>
                <td>Nama :</td>
                <td><input type="text" name="nama" required></td>
            </tr>
            <tr>
                <td>Tgl Lahir (dd-mm-yyyy) :</td>
                <td><input type="date" name="tgl_lahir" required></td>
            </tr>
            <tr>
                <td>Jenis Kelamin :</td>
                <td>
                    <input type="radio" name="jenis_kelamin" value="Laki-Laki" required> Laki-Laki
                    <input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan
                </td>
            </tr>
            <tr>
                <td>Alamat :</td>
                <td><textarea name="alamat" rows="4" cols="30"></textarea></td>
            </tr>
            <tr>
                <td>Tinggal di :</td>
                <td>
                    <select name="tinggal_di" required>
                        <option value="">--pilih--</option>
                        <option value="Kos/Kontrakan">Kos/Kontrakan</option>
                        <option value="Rumah saudara">Rumah saudara</option>
                        <option value="Rumah orang tua">Rumah orang tua</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Pilih 2 hobi yang paling disukai :</td>
                <td>
                    <input type="checkbox" name="hobi" value="Science"> Science<br>
                    <input type="checkbox" name="hobi" value="Technology"> Technology<br>
                    <input type="checkbox" name="hobi" value="Art"> Art<br>
                    <input type="checkbox" name="hobi" value="Sport"> Sport
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
