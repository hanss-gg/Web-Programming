<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Formulir Data Diri</h2>
        <form action="proses_data_diri.php" method="POST">
            <div class="form-group">
                <label for="nama" class="main-label">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="tanggal_lahir" class="main-label">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="main-label">Hobi:</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" name="hobi[]" value="Membaca"> Membaca
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="hobi[]" value="Musik"> Musik
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Kirim</button>
        </form>
    </div>

</body>
</html>
