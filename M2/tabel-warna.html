<body>
    <table border="3" cellspacing="0" width="500" height="700"
           style="border-color: white;">

            <td colspan="2" bgcolor="blue" height="100"></td>
            <td bgcolor="white" width="100"></td>
        </tr>

            <td bgcolor="lime" height="100"></td>
            <td colspan="2" rowspan="2" bgcolor="lime"></td>
            <td bgcolor="blue" rowspan="2"></td>
        </tr>
        <tr>
            <td bgcolor="white" height="100"></td>
        </tr>
        <tr>
            <td bgcolor="blue" height="100"></td>
            <td bgcolor="white"></td>
            <td bgcolor="blue"></td>
            <td bgcolor="white"></td>
        </tr>
        <tr>
            <td bgcolor="blue" height="300"></td>
            <td bgcolor="white" colspan="4"></td>
        </tr>
    </table>

</html>
