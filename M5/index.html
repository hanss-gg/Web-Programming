<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruang Baca</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-md navbar-dark bg-success px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="#">Ruang Baca</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
        aria-controls="navMenu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
      <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1 d-flex justify-content-center align-items-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">

        <div class="card shadow border-0">
          <div class="card-body p-4 text-center">
            <h4 class="mb-1">Masuk ke Ruang Baca</h4>
            <p class="text-muted small mb-4">Temukan bacaan untuk hari ini.</p>

            <form class="text-start">
              <div class="mb-3">
                <label for="username" class="form-label small">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="Masukkan username"
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label small">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Masukkan password"
                />
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="ingatsaya" />
                <label class="form-check-label small" for="ingatsaya">
                  Ingat saya
                </label>
              </div>

              <button type="submit" class="btn btn-success w-100">Masuk</button>
            </form>
          </div>

          <div class="card-footer bg-light text-center py-3">
            <a href="#" class="link-success small">Lupa password?</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
